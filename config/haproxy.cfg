global
    log stdout format raw local0
defaults
    log global
    mode http
    option httplog
    option redispatch
    retries 2
    timeout connect 5s
    timeout client 700s
    timeout server 700s
    timeout queue 1800s
frontend ollama_frontend
    bind *:11434
    default_backend ollama_backends
backend ollama_backends
    option httpchk GET /health
    http-check expect status 200
    timeout connect 2s
    timeout server 450s
    timeout check 3s
    server ordered_adapter adapter:11434 check inter 5s fall 2 rise 1
